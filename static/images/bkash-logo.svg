<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" width="320" height="90">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- bKash Origami Bird -->
  <g transform="translate(10, 8) scale(0.95)" filter="url(#shadow)">
    <!-- Top-left beak/head facet -->
    <polygon points="40,2 12,32 40,32" fill="#E2136E"/>
    <!-- Central upper facet -->
    <polygon points="40,2 40,32 72,18" fill="#F04D8C"/>
    <!-- Top right wing -->
    <polygon points="40,2 72,18 78,2" fill="#E2136E"/>
    <!-- Main upper body -->
    <polygon points="12,32 40,32 32,54" fill="#C41258"/>
    <!-- Center lower body -->
    <polygon points="40,32 72,18 56,54" fill="#E2136E"/>
    <!-- Under belly -->
    <polygon points="32,54 40,32 56,54" fill="#940B41"/>
    <!-- Tail facet -->
    <polygon points="32,54 56,54 48,74" fill="#C41258"/>
    <!-- Tail tip -->
    <polygon points="48,74 56,54 68,64" fill="#E2136E"/>
    <!-- Far wing -->
    <polygon points="56,54 72,18 78,42" fill="#F04D8C"/>
  </g>
  <!-- bKash Typography -->
  <g transform="translate(95, 62)">
    <text font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="44"
          font-weight="800"
          letter-spacing="-1.5">
      <tspan fill="#E2136E">b</tspan>
      <tspan fill="#E2136E">K</tspan>
      <tspan fill="#E2136E">a</tspan>
      <tspan fill="#E2136E">s</tspan>
      <tspan fill="#E2136E">h</tspan>
    </text>
    <!-- Characteristic bKash dot on i / accent flourish -->
    <circle cx="132" cy="-40" r="4.5" fill="#E2136E"/>
  </g>
</svg>
